name: Deploy & Scan Flight Deals to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Active Keys Cache
        uses: actions/cache/restore@v4
        with:
          path: active_keys.json
          key: active-keys-cache-
          restore-keys: |
            active-keys-cache-

      - name: Ensure Active Keys Exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scan_keys.js

      - name: Hunt Flight Deals
        run: |
          node error_fare_hunter.js

      - name: Commit updated report to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add error_fares_report.json flight_cache.json flight_history.json active_keys.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update flight deals report [skip ci]"
            git push origin HEAD:${{ github.ref_name || 'main' }} || git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
